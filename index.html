
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahim Adventure</title>
<style>
body {
  margin: 0;
  background: #87ceeb;
  text-align: center;
  font-family: Arial;
}
h2 { color: #164d25; }
canvas {
  background: #8ee65a;
  width: 100%;
  max-width: 800px;
  border: 4px solid #286b24;
}
.controls button {
  font-size: 25px;
  padding: 15px 25px;
  margin: 8px;
  border-radius: 12px;
  border: none;
  background: #ffca28;
}
</style>
</head>
<body>

<h2>🌳 Rahim Adventure</h2>
<h3 id="score">Score: 0</h3>

<canvas id="game" width="800" height="400"></canvas>

<div class="controls">
<button onclick="left()">⬅️</button>
<button onclick="jump()">⬆️</button>
<button onclick="right()">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:80, y:300, w:40, h:50, vy:0};
let score = 0;
let ground = 350;

function draw() {
  ctx.clearRect(0,0,800,400);

  // Sky
  ctx.fillStyle = "#87ceeb";
  ctx.fillRect(0,0,800,400);

  // Sun
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(700,65,35,0,Math.PI*2);
  ctx.fill();

  // Ground
  ctx.fillStyle = "#258c32";
  ctx.fillRect(0,ground,800,50);

  // Coins
  ctx.fillStyle = "gold";
  ctx.beginPath();
  ctx.arc(350,290,15,0,Math.PI*2);
  ctx.fill();

  // Player
  ctx.fillStyle = "#ff5722";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle = "white";
  ctx.fillRect(player.x+25,player.y+10,8,8);

  player.y += player.vy;
  player.vy += 0.7;

  if(player.y+player.h >= ground) {
    player.y = ground-player.h;
    player.vy = 0;
  }

  requestAnimationFrame(draw);
}

function left() {
  player.x = Math.max(0,player.x-20);
}
function right() {
  player.x = Math.min(760,player.x+20);
}
function jump() {
  if(player.y+player.h >= ground) {
    player.vy = -13;
  }
}

draw();
</script>

</body>
</html>
